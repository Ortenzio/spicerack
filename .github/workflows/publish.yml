name: "Publish to NPM"

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build --workspace=packages/controls
      - run: npm run build --workspace=packages/spicerack
      - name: "Publish Package"
        run: |
          VERSION=$(node -p "require('./packages/spicerack/package.json').version")

          if [[ "$VERSION" == *-* ]]; then
            npm publish --workspace=packages/spicerack --tag beta --access public
          else
            npm publish --workspace=packages/spicerack --access public
          fi
